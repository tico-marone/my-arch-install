# Curated package catalog for my-arch-install
# Target profile: Intel Core i7-3770 (Ivy Bridge), Intel HD Graphics 4000,
# SATA SSD (ext4, single-boot UEFI), zram, linux-zen, systemd-boot, minimal KDE Plasma.

[groups.base_system]
title = "Base System & Kernel"
description = "Essential Arch Linux foundation, linux-zen kernel, storage tools, and networking."
locked = true

[groups.hardware_intel]
title = "Intel i7-3770 & HD 4000 Stack"
description = "Microcode updates, Mesa OpenGL (crocus), and VA-API video acceleration for Ivy Bridge."
locked = false

[groups.kde_core]
title = "KDE Plasma Minimal Core"
description = "Curated Plasma Wayland desktop components without kde-applications or plasma-meta bloat."
locked = true

[groups.kde_recommended]
title = "Desktop Essentials & Fonts"
description = "Core KDE utilities (Konsole, Dolphin), PipeWire audio, thumbnailers, and system fonts."
locked = false

[groups.optional_apps]
title = "Optional Applications"
description = "Toggleable everyday applications and system utilities."
locked = false

# --- Base System & Kernel ---

[[packages]]
name = "base"
repo = "core"
group = "base_system"
required = true
default = true
summary = "Minimal package set defining a basic Arch Linux installation."
reason = "Mandatory foundation providing glibc, systemd, coreutils, pacman, and filesystem layout."

[[packages]]
name = "linux-zen"
repo = "extra"
group = "base_system"
required = true
default = true
summary = "Featureful kernel and modules tuned for desktop responsiveness."
reason = "Selected kernel configured with desktop-oriented scheduling and preemption."

[[packages]]
name = "linux-zen-headers"
repo = "extra"
group = "base_system"
required = false
default = false
summary = "Headers and scripts for building kernel modules against linux-zen."
reason = "Only needed if you plan to build out-of-tree DKMS kernel modules; optional for HD 4000."

[[packages]]
name = "linux-firmware"
repo = "core"
group = "base_system"
required = true
default = true
summary = "Firmware files for Linux kernel hardware drivers."
reason = "Ensures onboard Ethernet controllers, storage controllers, and peripherals load required firmware."

[[packages]]
name = "dosfstools"
repo = "core"
group = "base_system"
required = true
default = true
summary = "DOS filesystem utilities (mkfs.fat, fsck.fat)."
reason = "Required to format and maintain the FAT32 EFI System Partition (ESP)."

[[packages]]
name = "e2fsprogs"
repo = "core"
group = "base_system"
required = true
default = true
summary = "Ext2/ext3/ext4 filesystem utilities (mkfs.ext4, e2fsck)."
reason = "Required to create, check, and maintain ext4 filesystems."

[[packages]]
name = "zram-generator"
repo = "extra"
group = "base_system"
required = true
default = true
summary = "Systemd unit generator for compressed RAM swap devices."
reason = "Provides fast zstd-compressed swap in RAM without wearing out the SATA SSD."

[[packages]]
name = "networkmanager"
repo = "extra"
group = "base_system"
required = true
default = true
summary = "Network connection manager and user applications."
reason = "Manages Ethernet (and optional Wi-Fi/VPN) connections and integrates directly with Plasma."

[[packages]]
name = "sudo"
repo = "core"
group = "base_system"
required = true
default = true
summary = "Execute commands as root or another user."
reason = "Allows the primary wheel-group user account to perform administrative tasks."

# --- Intel i7-3770 & HD 4000 Stack ---

[[packages]]
name = "intel-ucode"
repo = "extra"
group = "hardware_intel"
required = true
default = true
summary = "Microcode update files for Intel CPUs."
reason = "Provides stability and security microcode patches for Intel Core i7-3770, packed into initramfs via the microcode hook."

[[packages]]
name = "mesa"
repo = "extra"
group = "hardware_intel"
required = true
default = true
summary = "Open-source OpenGL implementation including the Intel crocus driver."
reason = "Required for hardware-accelerated desktop compositing (KWin Wayland) on Intel HD 4000 (Gen7)."

[[packages]]
name = "libva-intel-driver"
repo = "extra"
group = "hardware_intel"
required = false
default = true
summary = "VA-API implementation for Intel G45 and HD Graphics (up to Coffee Lake)."
reason = "Provides hardware video decoding (H.264/MPEG-2) for HD 4000; unlike intel-media-driver which is Broadwell+ only."

[[packages]]
name = "vulkan-intel"
repo = "extra"
group = "hardware_intel"
required = false
default = false
summary = "Open-source Vulkan driver for Intel GPUs (includes hasvk for Gen7)."
reason = "Optional for apps using Vulkan; Intel HD 4000 (Ivy Bridge) only supports partial Vulkan features."

[[packages]]
name = "libva-utils"
repo = "extra"
group = "hardware_intel"
required = false
default = false
summary = "Collection of utilities and tests for VA-API (vainfo)."
reason = "Optional diagnostic tool to verify HD 4000 hardware video acceleration after installation."

