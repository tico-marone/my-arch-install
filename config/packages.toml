# Curated package catalog for my-arch-install

[groups.base_system]
title = "Base System & Kernel"
description = "Core Arch Linux runtime, linux-zen kernel, storage tools, and networking."
locked = true

[groups.hardware_intel]
title = "Intel i7-3770 & HD 4000"
description = "CPU microcode, Mesa OpenGL (crocus), and VA-API video acceleration for Ivy Bridge."
locked = false

[groups.kde_core]
title = "KDE Plasma Core"
description = "Minimal Plasma Wayland shell, display manager, and desktop portals."
locked = true

[groups.kde_recommended]
title = "Desktop Essentials & Fonts"
description = "PipeWire audio, Konsole, Dolphin, thumbnail plugins, and base fonts."
locked = false

[groups.optional_apps]
title = "Optional Applications"
description = "Everyday desktop utilities."
locked = false

[[packages]]
name = "base"
repo = "core"
group = "base_system"
required = true
default = true
summary = "Minimal package set defining a basic Arch Linux installation."
reason = "Core foundation (glibc, systemd, coreutils, pacman)."

[[packages]]
name = "linux-zen"
repo = "extra"
group = "base_system"
required = true
default = true
summary = "Kernel and modules tuned for interactive desktop responsiveness."
reason = "Primary system kernel."

